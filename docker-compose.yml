services:
  bamboo-notifier:
    build: .
    image: bamboo-notifier:latest
    container_name: bamboo-notifier
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BAMBOO_BASE_URL=https://bamboo.local.shifamily.com
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - BAMBOO_TOKEN=${BAMBOO_TOKEN}
      # Optional: protects the dashboard/API with HTTP Basic Auth. Leave both unset to
      # keep the dashboard open (fine if this port is only reachable on a private network).
      - STATUS_USER=${STATUS_USER:-}
      - STATUS_PASSWORD=${STATUS_PASSWORD:-}
    volumes:
      # Mount read-only so plan-mapping edits on the host are picked up live (fs.watch),
      # without giving the container write access to it.
      - ./config/repo-plan-map.json:/app/config/repo-plan-map.json:ro
      # Persists the SQLite database (delivery/build history + stats) across container
      # restarts and rebuilds - see README "History & stats database". docker-entrypoint.sh
      # chowns this to the non-root `node` user on startup, so no manual `mkdir`/`chown`
      # is needed even on the very first `up` (when Docker would otherwise auto-create
      # this dir owned by root).
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
